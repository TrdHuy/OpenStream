name: Phase 7 Release Candidate

on:
  push:
    branches:
      - phase-7-larix-ux-release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase7-release-candidate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-release-candidate:
    name: Build and verify Android release candidate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android build packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;27.0.12077973"

      - name: Run repository tests and Android lint
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q
          cd android
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug

      - name: Create ephemeral CI signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/openstream-phase7-ci.keystore" \
            -storepass phase7-ci-only \
            -alias openstream-phase7-ci \
            -keypass phase7-ci-only \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=OpenStream Phase 7 CI, OU=CI, O=OpenStream, L=CI, S=CI, C=US"

      - name: Compute Android version metadata
        id: version
        run: echo "code=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - name: Build signed release candidate with native SRT enabled
        working-directory: android
        env:
          OPENSTREAM_RELEASE_KEYSTORE: ${{ runner.temp }}/openstream-phase7-ci.keystore
          OPENSTREAM_RELEASE_STORE_PASSWORD: phase7-ci-only
          OPENSTREAM_RELEASE_KEY_ALIAS: openstream-phase7-ci
          OPENSTREAM_RELEASE_KEY_PASSWORD: phase7-ci-only
          OPENSTREAM_VERSION_NAME: 1.0.1-rc
          OPENSTREAM_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Verify release APK signature and package metadata
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          test -f "$apk"
          "$build_tools/apksigner" verify --verbose "$apk"
          "$build_tools/aapt" dump badging "$apk" | tee release-badging.txt
          grep -q "package: name='dev.openstream.app'" release-badging.txt
          if grep -q "application-debuggable" release-badging.txt; then
            echo "::error::Release candidate must not be debuggable"
            exit 1
          fi

      - name: Normalize release candidate artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/openstream-android-release-candidate.apk
          (cd dist && sha256sum openstream-android-release-candidate.apk > openstream-android-release-candidate.apk.sha256)
          printf 'Ephemeral CI signing key; NOT a production release signature.\n' > dist/release-candidate-signing.txt

      - name: Upload release candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: openstream-android-release-candidate
          path: |
            dist/openstream-android-release-candidate.apk
            dist/openstream-android-release-candidate.apk.sha256
            dist/release-candidate-signing.txt
          if-no-files-found: error
